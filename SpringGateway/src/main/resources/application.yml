spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ReactiveMongoDemo
              uri: http://localhost:8082
              predicates:
                - Path=/api/v3/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG